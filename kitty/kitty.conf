# kitty.conf — tuned for comfortable, low-fatigue reading

include hearth-theme.conf

# --- Typography ---------------------------------------------------------
# JetBrains Mono: tall x-height, clear look-alike characters, crisp on low DPI.
# SemiBold for bold: full Bold clumps on this 96 DPI screen.
# 14.25pt = exactly 19px at 96 DPI (whole-pixel sizes render sharper; steps are
# every 0.75pt: 13.5=18px, 14.25=19px, 15=20px).
# Previous choice, for reference: IBM Plex Mono Text at 14.25pt.
font_family      JetBrains Mono Regular
bold_font        JetBrains Mono SemiBold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono SemiBold Italic
font_size        14.25

# Extra line spacing is the single biggest win for reading flow:
# the eye finds the start of the next line without effort.
modify_font cell_height 120%
modify_font baseline 1


# Plain characters everywhere: -> and != stay as typed
disable_ligatures always

# --- Breathing room -----------------------------------------------------
window_padding_width 6 10
placement_strategy   center

# --- Calm cursor --------------------------------------------------------
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

# --- Smooth, predictable scrolling -------------------------------------
scrollback_lines            20000
wheel_scroll_multiplier     3.0
touch_scroll_multiplier     1.5
scrollback_pager_history_size 64

# --- No visual noise ----------------------------------------------------
enable_audio_bell     no
visual_bell_duration  0
window_alert_on_bell  no
# Instead of a bell: a desktop notification when a command that ran 30s+
# finishes in a window you can't currently see (needs shell integration, on by default)
notify_on_cmd_finish  invisible 30.0
url_style             curly
detect_urls           yes
mouse_hide_wait       2.0

# --- Tabs: quiet and out of the way ------------------------------------
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_title_template    "{index}: {title}"
inactive_tab_font_style normal
active_tab_font_style   bold

# --- Windows ------------------------------------------------------------
window_border_width   1pt
inactive_text_alpha   1.0
hide_window_decorations no
confirm_os_window_close 0

# --- Quick font-size tweaks while reading ------------------------------
# Steps of 0.75pt = exactly 1px at 96 DPI, so zooming always lands on
# whole-pixel sizes (13.5=18px, 14.25=19px, 15=20px, ...). Ctrl+0 resets to 14.25.
map ctrl+equal  change_font_size all +0.75
map ctrl+minus  change_font_size all -0.75
map ctrl+0      change_font_size all 0

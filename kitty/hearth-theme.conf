# Hearth — a warm, low-glare dark theme for long reading sessions
#
# Design goals
#   * Deep warm charcoal background (not pure black) — less halation / "glow" around text
#   * Parchment foreground at ~12.5:1 contrast — crisp, but not the harsh 15–20:1
#     of white-on-black that causes fatigue over hours
#   * Muted, desaturated accents (all >= 6:1) so colour carries meaning
#     without shouting; nothing neon
#   * Dim text (comments, hints) kept >= 5.5:1 so it stays readable

# --- Base ---------------------------------------------------------------
foreground              #E3DBCD
background              #1D1B18
selection_foreground    #EDE6DA
selection_background    #3D4650
# Cursor: muted wheat (same as the active tab), softer than amber.
# 7.4:1 against the background; letter under it in the background colour, 7.4:1
cursor                  #C7A56E
cursor_text_color       #1D1B18
url_color               #8FADD0

# --- Window chrome ------------------------------------------------------
active_border_color     #8C7A5B
inactive_border_color   #36322C
bell_border_color       #D9B776
wayland_titlebar_color  #161512
macos_titlebar_color    #161512

# --- Tabs ---------------------------------------------------------------
active_tab_foreground   #1D1B18
active_tab_background   #C7A56E
inactive_tab_foreground #9A9083
inactive_tab_background #161512
tab_bar_background      #161512

# --- Marks --------------------------------------------------------------

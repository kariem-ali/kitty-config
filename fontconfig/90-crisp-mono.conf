<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Sharper terminal fonts on a low-DPI (96 DPI) screen:
     use each font's own full hinting so stems snap to whole pixels. -->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains"><string>IBM Plex Mono</string></test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>JetBrains Mono</string></test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
